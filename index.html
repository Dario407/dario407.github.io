<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Libri minecraft</title>
<style>
:root{--bg:#0b100c;--panel:#151b17;--panel2:#1c241e;--line:#313d34;--text:#f1f5f2;--muted:#96a39a;--accent:#61d47f;--paper:#efe3be;--paper2:#dac99d;--ink:#221b12;--danger:#ff7777;--warn:#ffcf66}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#18231b 0,#0b100c 58%);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}.app{max-width:900px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:16px}.brand h1{margin:0;font-size:clamp(26px,4vw,40px);letter-spacing:-.04em}.brand p{margin:6px 0 0;color:var(--muted);font-size:14px}.badge{font-size:12px;color:#8fe9a6;border:1px solid var(--line);background:#152019;padding:7px 10px;border-radius:999px}.panel{background:rgba(21,27,23,.97);border:1px solid var(--line);border-radius:20px;box-shadow:0 18px 50px rgba(0,0,0,.22);padding:14px}.toolbar,.actions,.templatebar,.pagebar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.toolbar{justify-content:center;background:#101511;border:1px solid var(--line);border-radius:14px;padding:9px;margin-bottom:14px}.toolbarLabel{font-size:11px;color:var(--muted)}.swatches{display:flex;gap:4px;flex-wrap:wrap}.swatch{width:25px;height:25px;padding:0;border-radius:7px;border:2px solid rgba(255,255,255,.16);cursor:pointer}.fmt{min-width:31px;height:29px;padding:0 8px}.fmt.bold{font-weight:900}.fmt.italic{font-style:italic}.fmt.under{text-decoration:underline}.fmt.strike{text-decoration:line-through}button{appearance:none;border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-weight:700;cursor:pointer;background:#243028;color:var(--text)}button:hover{filter:brightness(1.08)}button.primary{background:var(--accent);color:#0b170f;border-color:transparent}button.danger{color:#ffc0c0;border-color:#643737;background:#2b1919}button.small{padding:7px 10px;font-size:12px}.stage{display:flex;flex-direction:column;align-items:center;padding:8px 0 4px}.book{width:244px;max-width:100%;height:322px;background:linear-gradient(135deg,var(--paper),var(--paper2));border-radius:6px 15px 15px 6px;box-shadow:inset 8px 0 17px rgba(91,67,30,.12),0 18px 40px rgba(0,0,0,.28);padding:18px 18px 18px 22px;position:relative;color:var(--ink);overflow:hidden}.book:after{content:"";position:absolute;left:11px;top:0;bottom:0;width:1px;background:rgba(74,53,27,.12)}.headerArea{height:40px;white-space:pre;font:15px/20px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#111}.headerArea.off{display:none}.headerAqua{color:#00aaaa}.pageEditor{width:100%;height:280px;overflow:hidden;outline:none;white-space:pre-wrap;word-break:normal;font:15px/20px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;caret-color:#111}.headerArea:not(.off)+.pageEditor{height:240px}.pageEditor:empty:before{content:"Scrivi qui…";color:rgba(34,27,18,.35)}.pageEditor span{white-space:pre-wrap}.pageControls{margin-top:11px;display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap}.headerToggle{display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:7px 10px;font-size:12px;cursor:pointer}.headerToggle input{accent-color:var(--accent)}.pager{display:flex;align-items:center;gap:12px;margin-top:10px}.pager button{width:36px;height:36px;padding:0;border-radius:50%}.pageNo{min-width:120px;text-align:center;color:var(--muted);font-size:12px}.status{margin-top:9px;min-height:18px;color:var(--muted);font-size:11px;text-align:center}.status.warn{color:var(--warn)}.actions{justify-content:center;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}.hiddenFile{display:none}.templateBox{margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}.templateTitle{font-size:12px;color:var(--muted);text-align:center;margin-bottom:9px}.templatebar{justify-content:center}.field{display:flex;align-items:center;gap:7px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:7px 9px}.field label{font-size:11px;color:var(--muted)}.field input,.field select{background:transparent;border:0;outline:0;color:var(--text);font:inherit}.field input{width:145px}.field select{min-width:150px}.credit{text-align:center;color:#718077;font-size:11px;margin-top:16px}.credit strong{color:#98a79d;font-weight:600}.toast{position:fixed;right:18px;bottom:18px;max-width:380px;padding:12px 14px;border-radius:12px;background:#2b2414;color:#ffe5a2;border:1px solid #66532a;box-shadow:0 16px 40px rgba(0,0,0,.35);font-size:13px;opacity:0;transform:translateY(10px);pointer-events:none;transition:.2s;z-index:10}.toast.show{opacity:1;transform:none}.toast.error{background:#321919;color:#ffc2c2;border-color:#6d3232}@media(max-width:560px){.app{padding:10px}.top{flex-direction:column}.toolbar{justify-content:flex-start}.field input{width:120px}.field select{min-width:125px;width:125px}}
</style>
</head>
<body>
<div class="app">
  <div class="top"><div class="brand"><h1>Creatore libri minecraft</h1><p>Modifica il libro direttamente sulla pagina.</p></div><div class="badge">Minecraft 1.21.8</div></div>
  <main class="panel">
    <div class="toolbar">
      <span class="toolbarLabel">Colori</span><div class="swatches" id="swatches"></div>
      <button class="fmt bold" data-style="l" title="Grassetto">B</button>
      <button class="fmt italic" data-style="o" title="Corsivo">I</button>
      <button class="fmt under" data-style="n" title="Sottolineato">U</button>
      <button class="fmt strike" data-style="m" title="Barrato">S</button>
      <button class="fmt" id="resetFmt" title="Rimuovi formattazione">Reset</button>
    </div>
    <div class="stage">
      <div class="book">
        <div class="headerArea off" id="headerArea">        ᅳ  <span class="headerAqua">⚖</span>  ᅳ\n</div>
        <div class="pageEditor" id="pageEditor" contenteditable="true" spellcheck="false"></div>
      </div>
      <div class="pageControls">
        <label class="headerToggle"><input id="headerToggle" type="checkbox"><span id="headerLabel">Header pagina 1</span></label>
        <button class="small" id="addPageBtn">+ Pagina</button>
        <button class="small danger" id="deletePageBtn">Elimina pagina</button>
      </div>
      <div class="pager"><button id="prevBtn">←</button><div class="pageNo" id="pageNo">Pagina 1 di 1</div><button id="nextBtn">→</button></div>
      <div class="status" id="status">14 righe disponibili · 21 caratteri per riga</div>
    </div>
    <div class="actions">
      <button class="primary" id="exportBtn">Esporta .txt</button>
      <button id="importBtn">Importa libro</button><input class="hiddenFile" id="fileInput" type="file" accept=".txt,text/plain">
      <button id="copyBtn">Copia output</button>
      <button id="clearBtn">Nuovo libro</button>
    </div>
    <div class="templateBox">
      <div class="templateTitle">Template personali — salvati solo in questo browser</div>
      <div class="templatebar">
        <div class="field"><label>Nome</label><input id="templateName" type="text" maxlength="40" placeholder="Es. Contratto"></div>
        <button id="saveTemplateBtn">Salva template</button>
        <div class="field"><label>I miei template</label><select id="templateSelect"><option value="">Nessun template</option></select></div>
        <button id="loadTemplateBtn">Carica</button><button class="danger" id="deleteTemplateBtn">Elimina</button>
      </div>
    </div>
  </main>
  <div class="credit">Created by <strong>Baldo Prawno</strong></div>
</div>
<div class="toast" id="toast"></div>
<script>
const HEADER='        ᅳ  §3⚖§r  ᅳ',TEMPLATE_KEY='minecraftBookBuilder.templates.v1';
const COLOR_MAP={0:'#000000',1:'#0000AA',2:'#00AA00',3:'#00AAAA',4:'#AA0000',5:'#AA00AA',6:'#FFAA00',7:'#AAAAAA',8:'#555555',9:'#5555FF',a:'#55FF55',b:'#55FFFF',c:'#FF5555',d:'#FF55FF',e:'#FFFF55',f:'#FFFFFF'};
const $=id=>document.getElementById(id),editor=$('pageEditor'),headerArea=$('headerArea'),headerToggle=$('headerToggle'),statusEl=$('status'),toast=$('toast');
let pages=[''],headerPrefs=[false],currentPage=0,lastGoodHtml='',toastTimer,isRendering=false;
function stripCodes(s){return s.replace(/§[0-9a-fk-or]/gi,'')}
function vlen(s){return [...stripCodes(s)].length}
function showToast(msg,error=false){toast.textContent=msg;toast.className='toast show'+(error?' error':'');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.className='toast',2800)}
function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot',"'":'&#039;'}[c]))}
function styleCss(state){let css=[];if(state.color)css.push(`color:${COLOR_MAP[state.color]}`);if(state.l)css.push('font-weight:800');if(state.o)css.push('font-style:italic');let d=[];if(state.n)d.push('underline');if(state.m)d.push('line-through');if(d.length)css.push(`text-decoration:${d.join(' ')}`);return css.join(';')}
function rawToHtml(raw){let state={color:null,l:false,o:false,n:false,m:false},buf='',html='';const flush=()=>{if(!buf)return;const css=styleCss(state),txt=esc(buf);html+=css?`<span style="${css}">${txt}</span>`:txt;buf=''};for(let i=0;i<raw.length;i++){if(raw[i]==='§'&&i+1<raw.length&&/[0-9a-fk-or]/i.test(raw[i+1])){flush();const c=raw[++i].toLowerCase();if(COLOR_MAP[c])state={color:c,l:false,o:false,n:false,m:false};else if(c==='l')state.l=true;else if(c==='o')state.o=true;else if(c==='n')state.n=true;else if(c==='m')state.m=true;else if(c==='r')state={color:null,l:false,o:false,n:false,m:false};continue}buf+=raw[i]}flush();return html}
function nodeCodes(node,parent=[]){if(node.nodeType===Node.TEXT_NODE)return node.nodeValue||'';if(node.nodeName==='BR')return '\n';let codes=[...parent],prefix='';const el=node.nodeType===Node.ELEMENT_NODE?node:null;if(el){const color=el.dataset?.mcColor,style=el.dataset?.mcStyle,reset=el.dataset?.mcReset;if(reset){prefix+='§r';codes=[]}if(color){prefix+='§'+color;codes=[color]}if(style){prefix+='§'+style;codes.push(style)}}let out=prefix;for(const child of node.childNodes)out+=nodeCodes(child,codes);if(el&&(el.dataset?.mcColor||el.dataset?.mcStyle||el.dataset?.mcReset)){out+='§r';for(const c of parent)out+='§'+c}if(el&&['DIV','P'].includes(el.nodeName)&&!out.endsWith('\n'))out+='\n';return out}
function editorRaw(){return nodeCodes(editor,[]).replace(/\n+$/,'')}
function normalizeLines(raw){return raw.replace(/\r\n?/g,'\n').split('\n')}
function wrappedLineCount(raw){const lines=normalizeLines(raw),max=21;let count=0;for(const line of lines){const n=vlen(line);count+=Math.max(1,Math.ceil(Math.max(1,n)/max))}return count}
function validateRaw(raw){const capacity=headerPrefs[currentPage]?12:14;const count=wrappedLineCount(raw);return {ok:count<=capacity,count,capacity}}
function refreshStatus(raw=pages[currentPage]||''){const v=validateRaw(raw);statusEl.textContent=`${v.count}/${v.capacity} righe usate · 21 caratteri per riga`;statusEl.className='status'+(v.count>=v.capacity?' warn':'')}
function renderPage(){isRendering=true;const raw=pages[currentPage]||'';editor.innerHTML=rawToHtml(raw).replace(/\n/g,'<br>');headerToggle.checked=headerPrefs[currentPage]===true;headerArea.classList.toggle('off',!headerToggle.checked);$('headerLabel').textContent=`Header pagina ${currentPage+1}`;$('pageNo').textContent=`Pagina ${currentPage+1} di ${pages.length}`;lastGoodHtml=editor.innerHTML;refreshStatus(raw);isRendering=false}
function saveCurrent(){pages[currentPage]=editorRaw()}
function placeCaretEnd(){const r=document.createRange();r.selectNodeContents(editor);r.collapse(false);const s=getSelection();s.removeAllRanges();s.addRange(r);editor.focus()}
function wrapSelection(attrs){const sel=getSelection();if(!sel.rangeCount||sel.isCollapsed||!editor.contains(sel.anchorNode)){showToast('Seleziona del testo nella pagina.',true);return}const range=sel.getRangeAt(0),span=document.createElement('span');if(attrs.color){span.dataset.mcColor=attrs.color;span.style.color=COLOR_MAP[attrs.color]}if(attrs.style){span.dataset.mcStyle=attrs.style;if(attrs.style==='l')span.style.fontWeight='800';if(attrs.style==='o')span.style.fontStyle='italic';if(attrs.style==='n')span.style.textDecoration='underline';if(attrs.style==='m')span.style.textDecoration='line-through'}if(attrs.reset){span.dataset.mcReset='1';span.style.cssText='color:var(--ink);font-weight:400;font-style:normal;text-decoration:none'}span.appendChild(range.extractContents());range.insertNode(span);sel.removeAllRanges();const nr=document.createRange();nr.selectNodeContents(span);sel.addRange(nr);handleInput()}
function handleInput(){if(isRendering)return;const raw=editorRaw(),v=validateRaw(raw);if(!v.ok){editor.innerHTML=lastGoodHtml;placeCaretEnd();showToast('Pagina piena: passa alla pagina successiva o aggiungine una nuova.',true);return}pages[currentPage]=raw;lastGoodHtml=editor.innerHTML;refreshStatus(raw)}
function goPage(n){saveCurrent();if(n<0||n>=pages.length)return;currentPage=n;renderPage()}
function addPage(){saveCurrent();pages.splice(currentPage+1,0,'');headerPrefs.splice(currentPage+1,0,false);currentPage++;renderPage();placeCaretEnd()}
function deletePage(){if(pages.length===1){pages=[''];headerPrefs=[false];currentPage=0;renderPage();return}if(!confirm(`Eliminare la pagina ${currentPage+1}?`))return;pages.splice(currentPage,1);headerPrefs.splice(currentPage,1);currentPage=Math.min(currentPage,pages.length-1);renderPage()}
function output(){saveCurrent();return pages.map((p,i)=>(headerPrefs[i]?HEADER+'\n\n':'')+p).join('\f')}
function splitImportedPages(raw){const n=raw.replace(/^\uFEFF/,'').replace(/\r\n?/g,'\n');if(n.includes('\f'))return n.split('\f');return n.split(/(?:^|\n)\^L(?:\n|$)/)}
function isHeaderLine(line){return line===HEADER||line.trim()===HEADER.trim()}
function importBookText(text){const parts=splitImportedPages(text),newPages=[],prefs=[];for(const part of parts){let lines=part.split('\n');while(lines.length&&lines[0]==='')lines.shift();let hasHeader=false;if(lines.length&&isHeaderLine(lines[0])){hasHeader=true;lines.shift();if(lines[0]==='')lines.shift()}while(lines.length&&lines.at(-1)==='')lines.pop();prefs.push(hasHeader);newPages.push(lines.join('\n'))}pages=newPages.length?newPages:[''];headerPrefs=prefs.length?prefs:[false];currentPage=0;renderPage();showToast(`Libro importato: ${pages.length} pagin${pages.length===1?'a':'e'}.`)}
function download(){const blob=new Blob([output()],{type:'text/plain;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='libro_minecraft.txt';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function getTemplates(){try{return JSON.parse(localStorage.getItem(TEMPLATE_KEY)||'{}')}catch{return {}}}
function setTemplates(v){localStorage.setItem(TEMPLATE_KEY,JSON.stringify(v))}
function refreshTemplates(){const select=$('templateSelect'),data=getTemplates(),names=Object.keys(data).sort((a,b)=>a.localeCompare(b,'it'));select.innerHTML=names.length?'':'<option value="">Nessun template</option>';for(const n of names){const o=document.createElement('option');o.value=n;o.textContent=n;select.appendChild(o)}}
function saveTemplate(){saveCurrent();const name=$('templateName').value.trim();if(!name){showToast('Inserisci un nome per il template.',true);return}const data=getTemplates();if(data[name]&&!confirm(`Sovrascrivere il template “${name}”?`))return;data[name]={pages:[...pages],headerPrefs:[...headerPrefs],savedAt:Date.now()};setTemplates(data);refreshTemplates();$('templateSelect').value=name;showToast(`Template “${name}” salvato.`)}
function loadTemplate(){const name=$('templateSelect').value,d=getTemplates()[name];if(!d){showToast('Seleziona un template.',true);return}if(Array.isArray(d.pages)){pages=[...d.pages];headerPrefs=Array.isArray(d.headerPrefs)?[...d.headerPrefs]:pages.map(()=>false)}else if(typeof d.text==='string'){const parts=d.text.replace(/\f/g,'\n^L\n').split(/(?:^|\n)\^L(?:\n|$)/);pages=parts;headerPrefs=Array.isArray(d.headerPrefs)?[...d.headerPrefs]:parts.map(()=>false)}else return;while(headerPrefs.length<pages.length)headerPrefs.push(false);currentPage=0;renderPage();showToast(`Template “${name}” caricato.`)}
function deleteTemplate(){const name=$('templateSelect').value;if(!name){showToast('Seleziona un template.',true);return}if(!confirm(`Eliminare il template “${name}”?`))return;const d=getTemplates();delete d[name];setTemplates(d);refreshTemplates();showToast(`Template “${name}” eliminato.`)}
for(const [code,color] of Object.entries(COLOR_MAP)){const b=document.createElement('button');b.className='swatch';b.type='button';b.style.background=color;b.title='§'+code;b.onclick=()=>wrapSelection({color:code});$('swatches').appendChild(b)}
document.querySelectorAll('[data-style]').forEach(b=>b.onclick=()=>wrapSelection({style:b.dataset.style}));$('resetFmt').onclick=()=>wrapSelection({reset:true});
editor.addEventListener('input',handleInput);editor.addEventListener('paste',e=>{e.preventDefault();const text=e.clipboardData.getData('text/plain');document.execCommand('insertText',false,text)});editor.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();document.execCommand('insertLineBreak')}if(e.key==='Tab'){e.preventDefault();document.execCommand('insertText',false,'    ')}});
headerToggle.addEventListener('change',()=>{saveCurrent();const next=headerToggle.checked,raw=pages[currentPage];const capacity=next?12:14;if(wrappedLineCount(raw)>capacity){headerToggle.checked=false;showToast('Questa pagina contiene troppo testo per attivare l’header.',true);return}headerPrefs[currentPage]=next;renderPage()});
$('prevBtn').onclick=()=>goPage(currentPage-1);$('nextBtn').onclick=()=>goPage(currentPage+1);$('addPageBtn').onclick=addPage;$('deletePageBtn').onclick=deletePage;$('exportBtn').onclick=download;$('copyBtn').onclick=async()=>{await navigator.clipboard.writeText(output());showToast('Output copiato negli appunti.')};$('clearBtn').onclick=()=>{if(!confirm('Creare un nuovo libro e cancellare quello corrente?'))return;pages=[''];headerPrefs=[false];currentPage=0;renderPage()};$('importBtn').onclick=()=>$('fileInput').click();$('fileInput').addEventListener('change',async e=>{const f=e.target.files?.[0];if(!f)return;try{importBookText(await f.text())}catch{showToast('Impossibile leggere il file.',true)}e.target.value=''});$('saveTemplateBtn').onclick=saveTemplate;$('loadTemplateBtn').onclick=loadTemplate;$('deleteTemplateBtn').onclick=deleteTemplate;
refreshTemplates();renderPage();
</script>
</body>
</html>
